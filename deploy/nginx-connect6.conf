# Connect6 API and static game page.
#
# Add this to a server block whose root serves the static frontend, or adjust
# the alias/proxy path to match your deployment.
#
# - /connect6/game/ -> static frontend
# - /connect6/api/  -> Node gateway

location ^~ /connect6/api/ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}

location ^~ /connect6/game/ {
    alias /var/www/connect6/game/;
    index index.html;
    try_files $uri $uri/ /connect6/game/index.html;
    add_header Cache-Control "no-cache" always;
}
